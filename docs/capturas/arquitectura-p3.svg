<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#1B2430}
    .sub{font-size:10.5px;fill:#5B6675}
    .port{font-size:10px;font-weight:700;fill:#1A6FBF}
    .edge{stroke:#5B6675;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .edge-ext{stroke:#B9770E;stroke-width:1.6;fill:none;marker-end:url(#ao)}
    .note{font-size:10px;fill:#C0392B;font-weight:700}
    .netlbl{font-size:11px;font-weight:700;fill:#1E8449;letter-spacing:.04em}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B9770E"/></marker>
  </defs>

  <!-- fondo figura -->
  <rect x="0" y="0" width="860" height="600" fill="#FFFFFF"/>

  <!-- navegador del auditor -->
  <rect x="40" y="250" width="150" height="70" rx="8" fill="#E9F1FA" stroke="#1A6FBF" stroke-width="1.5"/>
  <text x="115" y="280" text-anchor="middle" class="lbl">Navegador</text>
  <text x="115" y="298" text-anchor="middle" class="sub">del auditor</text>

  <!-- red docker -->
  <rect x="230" y="40" width="470" height="520" rx="12" fill="none" stroke="#1E8449" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="245" y="62" class="netlbl">Red Docker · hooksuite-net</text>

  <!-- nginx -->
  <rect x="255" y="250" width="130" height="70" rx="8" fill="#FBF0DC" stroke="#B9770E" stroke-width="1.5"/>
  <text x="320" y="277" text-anchor="middle" class="lbl">nginx</text>
  <text x="320" y="294" text-anchor="middle" class="sub">proxy + Basic Auth</text>
  <text x="320" y="240" text-anchor="middle" class="port">:80</text>

  <!-- frontend -->
  <rect x="430" y="90" width="130" height="66" rx="8" fill="#F2F4F7" stroke="#5B6675" stroke-width="1.3"/>
  <text x="495" y="116" text-anchor="middle" class="lbl">frontend</text>
  <text x="495" y="133" text-anchor="middle" class="sub">React / Vite</text>
  <text x="572" y="112" class="port">:3000</text>

  <!-- backend -->
  <rect x="430" y="250" width="130" height="70" rx="8" fill="#E9F1FA" stroke="#1A6FBF" stroke-width="1.8"/>
  <text x="495" y="277" text-anchor="middle" class="lbl">backend</text>
  <text x="495" y="294" text-anchor="middle" class="sub">FastAPI / uvicorn</text>
  <text x="572" y="246" class="port">:8000</text>

  <!-- dvwa -->
  <rect x="430" y="400" width="130" height="62" rx="8" fill="#F2F4F7" stroke="#5B6675" stroke-width="1.3"/>
  <text x="495" y="426" text-anchor="middle" class="lbl">dvwa</text>
  <text x="495" y="443" text-anchor="middle" class="sub">lab interno</text>

  <!-- redis -->
  <rect x="600" y="250" width="80" height="62" rx="8" fill="#F2F4F7" stroke="#5B6675" stroke-width="1.3"/>
  <text x="640" y="276" text-anchor="middle" class="lbl">redis</text>
  <text x="640" y="293" text-anchor="middle" class="sub">eventos</text>

  <!-- ia -->
  <rect x="600" y="150" width="80" height="62" rx="8" fill="#E9F1FA" stroke="#1A6FBF" stroke-width="1.3"/>
  <text x="640" y="176" text-anchor="middle" class="lbl">ia</text>
  <text x="640" y="193" text-anchor="middle" class="sub">Claude</text>

  <!-- playwright -->
  <rect x="600" y="350" width="80" height="62" rx="8" fill="#F2F4F7" stroke="#5B6675" stroke-width="1.3"/>
  <text x="640" y="373" text-anchor="middle" class="lbl">play-</text>
  <text x="640" y="389" text-anchor="middle" class="lbl">wright</text>
  <text x="640" y="405" text-anchor="middle" class="sub">navegador</text>

  <!-- objetivo externo -->
  <rect x="720" y="250" width="110" height="70" rx="8" fill="#FBF0DC" stroke="#B9770E" stroke-width="1.5"/>
  <text x="775" y="277" text-anchor="middle" class="lbl">Objetivo</text>
  <text x="775" y="294" text-anchor="middle" class="sub">web auditada</text>

  <!-- edges -->
  <path class="edge" d="M190,285 L253,285"/>
  <text x="222" y="278" text-anchor="middle" class="sub">HTTP</text>
  <path class="edge" d="M385,275 C405,275 410,130 428,124"/>
  <text x="400" y="200" text-anchor="middle" class="sub">/</text>
  <path class="edge" d="M385,290 L428,288"/>
  <text x="407" y="305" text-anchor="middle" class="sub">/api /ws</text>
  <path class="edge" d="M385,300 C405,330 410,428 428,430"/>
  <text x="398" y="400" text-anchor="middle" class="sub">/dvwa</text>
  <path class="edge" d="M560,283 L598,283"/>
  <path class="edge" d="M540,250 C560,230 580,215 600,205"/>
  <path class="edge" d="M540,320 C560,345 580,360 600,372"/>
  <path class="edge-ext" d="M560,278 L718,278"/>
  <text x="639" y="270" text-anchor="middle" class="sub">httpx</text>

  <!-- nota de exposición actual -->
  <text x="495" y="540" text-anchor="middle" class="note">Estado actual (a corregir, ap. 7): :8000 y :3000 publicados directos; frontend evita el Basic Auth del :80</text>
</svg>
