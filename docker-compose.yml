version: '3.8'

networks:
  hooksuite-net:
    driver: bridge

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - PROXY_PORT=8080
      - MOCK_PLAYWRIGHT=false
    restart: unless-stopped
    networks:
      - hooksuite-net

  playwright:
    build: ./playwright
    environment:
      - BACKEND_URL=http://backend:8000
      - SESSION_TOKEN=hooksuite_session
      - PYTHONUNBUFFERED=1
      - DVWA_URL=http://dvwa:80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hooksuite-net

  ia:
    build: ./ia
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BACKEND_URL=http://backend:8000
      - MOCK_PLAYWRIGHT=false
      - SESSION_TOKEN=ia_session
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hooksuite-net

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hooksuite-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - hooksuite-net
