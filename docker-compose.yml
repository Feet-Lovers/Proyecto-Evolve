
networks:
  hooksuite-net:
    driver: bridge

volumes:
  # Cuentas de usuario (RF-12). Tiene que ser un volumen y no un directorio del
  # arbol de trabajo: el despliegue es `git reset --hard` + reconstruccion, asi que
  # cualquier cosa dentro del repositorio se perderia y el registro no serviria de
  # nada. El estado de SESION sigue siendo volatil a proposito (apartado 10): lo que
  # se persiste aqui son solo las cuentas.
  usuarios:

services:
  backend:
    build: ./backend
    # Sin 'ports': el backend NO se publica a internet. Nginx lo proxea (/api, /ws) y
    # ia/playwright le hablan por la red interna (http://backend:8000). Cierra el :8000 abierto.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - PROXY_PORT=8080
      - MOCK_PLAYWRIGHT=false
      # Autenticacion por usuario (Fase 2). Sin valor por defecto: si faltan, el
      # backend no arranca, en vez de arrancar sin autenticacion pareciendo correcto.
      # Se generan con: python3 tools/generar-credenciales.py
      - JWT_SECRET=${JWT_SECRET}
      - JWT_HORAS_VALIDEZ=${JWT_HORAS_VALIDEZ:-8}
      # Codigo de invitacion del registro. Tampoco tiene valor por defecto: si
      # faltara, el registro quedaria abierto y esta herramienta lanza trafico
      # contra terceros. Preferimos que no arranque.
      - REGISTRO_CODIGO=${REGISTRO_CODIGO}
      # Usuarios de arranque (OPCIONAL desde que existe el registro): se siembran en
      # el almacen si no estan, para tener con quien entrar en un despliegue nuevo.
      - HOOKSUITE_USERS=${HOOKSUITE_USERS:-}
      - USUARIOS_FICHERO=/data/usuarios.json
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - /tmp/firewall.sock:/tmp/firewall.sock
      - usuarios:/data
    networks:
      - hooksuite-net

  playwright:
    build: ./playwright
    environment:
      - BACKEND_URL=http://backend:8000
      - SESSION_TOKEN=hooksuite_session
      - PYTHONUNBUFFERED=1
      - DVWA_URL=http://dvwa:80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hooksuite-net
  redis:
    image: redis:7-alpine
    container_name: hooksuite-redis-1
    restart: unless-stopped
    networks:
      - hooksuite-net
  dvwa:
    image: vulnerables/web-dvwa
    restart: unless-stopped
    networks:
      - hooksuite-net

  ia:
    build: ./ia
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BACKEND_URL=http://backend:8000
      - MOCK_PLAYWRIGHT=false
      - SESSION_TOKEN=ia_session
      - PYTHONUNBUFFERED=1
      # Techo de llamadas por auditoria (client.py). Hasta el 10-oct NO se pasaba al
      # contenedor, asi que poner la variable en el shell no servia de nada: el modulo
      # usaba su defecto de 40 y una prueba que se creia gratis habria gastado saldo.
      # El defecto sigue siendo 40 y sigue declarado provisional: se fija con el dato de
      # la primera auditoria real, no a ojo.
      - HOOKSUITE_IA_MAX_LLAMADAS=${HOOKSUITE_IA_MAX_LLAMADAS:-40}
    depends_on:
      # Desde el 10-oct el modulo escucha el BUS, no al backend: su dependencia real es
      # redis. Dejarlo apuntando al backend hacia que arrancase antes que redis y muriese
      # en el primer ping. (`depends_on` solo espera el arranque, no que este listo: por
      # eso el modulo reintenta la conexion antes de rendirse.)
      - redis
    restart: unless-stopped
    networks:
      - hooksuite-net

  frontend:
    build: ./frontend
    # Sin 'ports': el frontend NO se publica directo (saltaba el Basic Auth). Se sirve por Nginx.
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hooksuite-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - hooksuite-net
