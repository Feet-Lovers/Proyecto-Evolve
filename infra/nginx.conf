events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # RETIRADOS (6-oct): /proxy.pac y /check/
        #
        # Pertenecían al modelo ABANDONADO de RF-02: el navegador se configuraba con un
        # fichero de autoconfiguración (PAC) y el servidor interceptaba su tráfico. Ese
        # modelo quedó expuesto y se saturó con tráfico de bots; se pivotó a que el
        # servidor ejecute las peticiones con httpx. Comprobado el 6-oct: su único
        # consumidor en el frontend era `PacOnboarding.jsx`, un componente que nadie
        # importaba — código muerto, ya eliminado. El `/check/alive` solo lo usaba ese
        # mismo componente para saber si el proxy respondía.
        #
        # Y una ganancia de seguridad: el PAC era la ÚNICA ruta que tenía que quedar sin
        # autenticar, porque un navegador no manda credenciales al pedirlo. Al retirarlo,
        # todas las rutas de /api exigen token, sin excepciones que mantener.

        # DVWA se retira de Nginx: queda SOLO interno (red Docker), accesible por
        # backend/playwright para pruebas, nunca servido a internet. De paso evita que
        # Nginx dependa de resolver 'dvwa' al arrancar (quitaba el crash-loop).
        # Basic Auth retirado 6-oct: lo sustituye el login por usuario de la Fase 2.
        # Era UNA contrasena compartida, no distinguia usuarios, y nadie la conocia ya.
        # Ahora /api/ y /ws/ exigen token firmado; el panel de entrada se sirve abierto.
        location / {
            proxy_pass http://frontend;
        }
    }
}
